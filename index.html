    <script>
        (function () {
            var img = document.getElementById('portrait');
            var rx = 0, ry = 0, tx = 0, ty = 0;
            var MAX = 15;

            document.addEventListener('mousemove', function (e) {
                tx = ((e.clientY / window.innerHeight) - 0.5) * -MAX;
                ty = ((e.clientX / window.innerWidth) - 0.5) * MAX;
            });

            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', function (e) {
                    if (e.gamma === null) return;
                    ty = (e.gamma / 90) * MAX;
                    tx = ((e.beta - 45) / 90) * -MAX;
                });
            }

            function animate() {
                rx += (tx - rx) * 0.08;
                ry += (ty - ry) * 0.08;
                img.style.transform = 'perspective(600px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
                requestAnimationFrame(animate);
            }
            animate();
        })();
    </script>

    <script>
        // Right-hand feed: latest blog posts (posts/posts.json) merged with curated posts (feed.json).
        (function () {
            var MAX_ITEMS = 10;
            var esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
            var get = url => fetch(url).then(r => r.ok ? r.json() : []).catch(() => []);

            function sourceOf(url) {
                if (/linkedin\.com/.test(url)) return 'linkedin';
                if (/(^|\/\/|\.)(x|twitter)\.com/.test(url)) return 'x';
                return 'link';
            }

            // LinkedIn post URLs carry an activity id; its embed iframe is keyed on that urn.
            function linkedinEmbed(url) {
                var m = url.match(/urn:li:(activity|share|ugcPost):(\d+)/) || url.match(/(activity)-(\d+)/);
                return m && 'https://www.linkedin.com/embed/feed/update/urn:li:' + m[1] + ':' + m[2];
            }

            function render(item) {
                if (item.embed && item.source === 'x') {
                    // The quote and link stay visible if widgets.js fails to load.
                    return `<blockquote class="twitter-tweet" data-theme="dark" data-dnt="true"><p class="feed-text">${esc(item.text)}</p><a href="${esc(item.url)}" class="feed-author">— ${esc(item.author)}</a></blockquote>`;
                }
                if (item.embed && item.source === 'linkedin' && linkedinEmbed(item.url)) {
                    return `<iframe src="${esc(linkedinEmbed(item.url))}" height="${+item.height || 500}" loading="lazy" title="linkedin post"></iframe>`;
                }
                return `<a href="${esc(item.url)}">
                    <div class="feed-meta">${item.source}${item.date ? ' · ' + esc(item.date) : ''}</div>
                    <div class="feed-text">${esc(item.text)}</div>
                    ${item.author ? `<div class="feed-author">— ${esc(item.author)}</div>` : ''}
                </a>`;
            }

            Promise.all([get('posts/posts.json'), get('feed.json')]).then(([posts, curated]) => {
                var items = posts
                    .map(p => ({ source: 'blog', url: 'post.html?slug=' + p.slug, text: p.title, date: p.date }))
                    .concat(curated.map(c => Object.assign({}, c, { source: sourceOf(c.url) })))
                    .sort((a, b) => (b.date || '').localeCompare(a.date || ''))
                    .slice(0, MAX_ITEMS);
                if (!items.length) return;

                document.getElementById('feed-list').innerHTML =
                    items.map(i => `<li class="feed-item">${render(i)}</li>`).join('');
                document.getElementById('feed').hidden = false;

                if (items.some(i => i.embed && i.source === 'x')) {
                    var s = document.createElement('script');
                    s.src = 'https://platform.x.com/widgets.js';
                    s.async = true;
                    document.body.appendChild(s);
                }
            });
        })();
    </script>
